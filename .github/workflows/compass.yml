name: Compass-Emu

# Builds and tests Compass-Emu on every push and pull request and makes the Windows zip.
# Pushing a tag like v0.3.12 also publishes a GitHub Release with that zip and the
# version's notes from CHANGELOG.md.
# No apt packages are needed: the Windows job builds the program (MSVC), the Linux job
# tests the emulation crates, which need no system libraries.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows build and test
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: compass-win-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: compass-win-

      - name: Test
        run: cargo test --locked --release -p grid_core -p i8087 -p compass

      - name: Build
        run: cargo build --locked --release -p compass

      - name: Make the Windows zip
        run: |
          VERSION=$(grep -m1 '^version' crates/bin/compass/Cargo.toml | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out/compass-emu
          cp -r dist/windows/. out/compass-emu/
          cp target/release/compass.exe out/compass-emu/
          cp LICENSE out/compass-emu/LICENSE.txt
          cd out && 7z a -tzip -bd "compass-emu-$VERSION.zip" compass-emu > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: compass-emu-${{ env.VERSION }}-windows
          path: out/compass-emu

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ "v$VERSION" = "$TAG" ] || { echo "tag $TAG does not match crate version $VERSION"; exit 1; }
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "$TAG" "out/compass-emu-$VERSION.zip" --title "Compass-Emu $VERSION" --notes-file notes.md

  linux:
    name: Linux tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: compass-linux-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: compass-linux-

      - name: Test the emulation crates
        run: cargo test --locked --release -p grid_core -p i8087

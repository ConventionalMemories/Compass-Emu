[package]
name = "compass"
version = "0.6.2"
edition = "2021"
license = "MIT"
description = "Compass-Emu: GRiD Compass emulator with a window"

[dependencies]
grid_core = { path = "../../lib/grid_core" }
marty_core = { path = "../../lib/marty_core", default-features = false }
minifb = "0.27"
eframe = { workspace = true, default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = { workspace = true, default-features = false }
rfd = { workspace = true }
serde = { workspace = true }
chrono = "0.4"
png = "0.17"
cpal = "0.15"
serialport = { version = "4.7", default-features = false }
serde_json = "1"
base64 = "0.13"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
